<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diccionario del repositorio</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#202938;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1100px;margin:auto}.head{background:#fff;padding:24px;border:1px solid #e2e7ef;border-radius:14px;margin-bottom:18px}h1{margin:0 0 8px;font-size:25px}.muted{color:#657187;font-size:13px}.base{font-family:Consolas,monospace;background:#f0f3f8;padding:7px 10px;border-radius:7px;display:inline-block;margin-top:8px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters input,.filters select{padding:12px;border:1px solid #ccd4e0;border-radius:9px;background:#fff;font-size:14px}.filters input{flex:1;min-width:230px}.filters select{min-width:180px}.summary{font-size:13px;color:#657187;margin:10px 2px}.entry{background:white;border:1px solid #e1e6ee;border-radius:11px;padding:14px 16px;margin:9px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.name{font-weight:650;overflow-wrap:anywhere}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.tag{font-size:11px;padding:4px 8px;border-radius:20px;background:#eef2f8;color:#46536a}.path{font-family:Consolas,monospace;font-size:12px;color:#536078;overflow-wrap:anywhere;margin-top:8px}.actions{display:flex;align-items:center;gap:7px}.btn{border:1px solid #cbd4e1;background:#fff;color:#26364d;border-radius:8px;padding:8px 10px;cursor:pointer;text-decoration:none;font-size:12px;white-space:nowrap}.btn:hover{background:#f0f4fa}.empty{background:#fff;border:1px dashed #cbd4e1;padding:28px;text-align:center;border-radius:10px;color:#657187}.foot{margin-top:20px;color:#788397;font-size:12px}@media(max-width:650px){body{padding:14px}.entry{grid-template-columns:1fr}.actions{justify-content:flex-start}}
</style></head><body><main>
<section class="head"><h1>Diccionario del repositorio</h1><div class="muted">Busca archivos o carpetas y consulta dónde están ubicados.</div><div class="base" id="base"></div></section>
<div class="filters"><input id="q" type="search" placeholder="Buscar por nombre, carpeta o ruta…" autofocus><select id="cat"><option value="">Todas las categorías</option></select><select id="kind"><option value="">Archivos y carpetas</option><option>Archivo</option><option>Carpeta</option></select></div>
<div class="summary" id="summary"></div><section id="results"></section>
<div class="foot">Índice generado a partir del último informe de copia. Si vuelves a organizar archivos, genera nuevamente este diccionario para actualizarlo.</div>
</main><script>
const DATA=__DATA_JSON__;
const $=id=>document.getElementById(id);
$('base').textContent='Repositorio: '+DATA.base;
[...new Set(DATA.items.map(x=>x.category))].sort((a,b)=>a.localeCompare(b,'es')).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('cat').append(o)});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fileUrl(path){return 'file:///'+path.replaceAll('\\','/').split('/').map((p,i)=>i===0?p:encodeURIComponent(p)).join('/');}
function render(){const q=$('q').value.trim().toLocaleLowerCase('es');const cat=$('cat').value;const kind=$('kind').value;
const rows=DATA.items.filter(x=>(!cat||x.category===cat)&&(!kind||x.kind===kind)&&(!q||(x.name+' '+x.category+' '+x.relative+' '+x.path).toLocaleLowerCase('es').includes(q)));
$('summary').textContent=rows.length+' resultado(s)';
if(!rows.length){$('results').innerHTML='<div class="empty">No se encontraron coincidencias.</div>';return;}
$('results').innerHTML=rows.map(x=>{const folder=x.kind==='Carpeta';const dir=folder?x.path:x.path.slice(0,x.path.lastIndexOf('\\'));
return `<article class="entry"><div><div class="name">${folder?'📁':'📄'} ${esc(x.name)}</div><div class="meta"><span class="tag">${esc(x.category)}</span><span class="tag">${x.kind}</span></div><div class="path">${esc(x.path)}</div></div><div class="actions"><button class="btn" data-copy="${esc(x.path)}">Copiar ruta</button><a class="btn" href="${esc(fileUrl(dir))}" title="Abrir ubicación en el navegador">Abrir ubicación</a></div></article>`}).join('');
}
['q','cat','kind'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));
$('results').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;try{await navigator.clipboard.writeText(b.dataset.copy);const old=b.textContent;b.textContent='Copiado';setTimeout(()=>b.textContent=old,1200)}catch{prompt('Copia esta ruta:',b.dataset.copy)}});
render();
</script></body></html>
